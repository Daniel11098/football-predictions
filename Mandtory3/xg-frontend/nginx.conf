server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/... sendes til Flask-containeren. Prefikset /api fjernes,
    # akkurat som Vite-proxyen gjør under utvikling.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
